name: TIA Baseline

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  baseline:
    name: Record TIA Baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: m3ue_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, redis
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel Application
        env:
          DB_CONNECTION: pg_test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          TEST_DB_DATABASE: m3ue_test
          TEST_DB_USERNAME: testing
          TEST_DB_PASSWORD: testing
        run: |
          cp .env.example .env || echo "APP_KEY=" > .env
          echo "REVERB_APP_SECRET=123" >> .env
          php artisan key:generate
          touch database/jobs.sqlite
          php artisan migrate --force

      - name: Record TIA baseline
        env:
          DB_CONNECTION: pg_test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          TEST_DB_DATABASE: m3ue_test
          TEST_DB_USERNAME: testing
          TEST_DB_PASSWORD: testing
          REDIS_HOST: 127.0.0.1
          REDIS_SERVER_PORT: 6379
        run: vendor/bin/pest --parallel --tia --fresh --recreate-databases

      - name: Resolve TIA baseline path
        id: tia
        run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

      - name: Upload TIA baseline
        uses: actions/upload-artifact@v4
        with:
          name: pest-tia-baseline
          path: ${{ steps.tia.outputs.path }}
          include-hidden-files: true
          retention-days: 30
